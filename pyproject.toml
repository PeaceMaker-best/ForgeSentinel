[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgesentinel"
version = "0.1.0"
description = "Local-first, policy-gated control plane for turning GitHub issues into verified, human-reviewed pull requests with coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "PeaceMaker-best", email = "221849497+PeaceMaker-best@users.noreply.github.com" }]
dependencies = ["jsonschema>=4.23,<5"]

[project.urls]
Homepage = "https://github.com/PeaceMaker-best/ForgeSentinel"
Repository = "https://github.com/PeaceMaker-best/ForgeSentinel.git"
Issues = "https://github.com/PeaceMaker-best/ForgeSentinel/issues"

[project.optional-dependencies]
codex-sdk = ["openai-codex>=0.147,<0.148"]
mcp = [
    "mcp>=2.1.1,<3",
]

[dependency-groups]
dev = ["mcp>=2.1.1,<3"]

[project.scripts]
forgesentinel = "forgesentinel.cli:main"

[tool.hatch.build]
exclude = ["/.git", "/.starfix", "/.forgesentinel", "/.venv", "/dist", "/notes"]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = ["src/forgesentinel"]

[tool.hatch.build.targets.wheel.force-include]
"docker/Dockerfile.runner" = "forgesentinel/data/Dockerfile.runner"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/docker/Dockerfile.runner",
  "/docs",
  "/tests",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/forgesentinel.example.toml",
  "/pyproject.toml",
  "/uv.lock",
]
